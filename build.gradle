plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = minecraft_version + '-' + mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neo_version

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Curseforge repository
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // curios repository
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }

    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    // Mods kept active during devbuild testing (loaded at runtime and available at compile time).
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation "curse.maven:legendarysurvivaloverhaul-840254:8569556"
    implementation "curse.maven:backpacked-352835:7866688"
    implementation "curse.maven:framework-549225:7530361" // Required library for Backpacked
    // Diet has no NeoForge build (abandoned on Forge 1.20.1) - dropped, see BuiltinTabVariables
    implementation "curse.maven:xaerosmap-317780:8449921"
    implementation "curse.maven:epic-fight-mod-405076:8175609"
    implementation "curse.maven:jobsplus-916985:8125195"
    // Jobs+ dependencies
    implementation "curse.maven:itemrestrictions-887774:8125177"
    implementation "curse.maven:ui-933200:8125054" // uilib
    implementation "curse.maven:arc-883593:8125132"
    implementation "curse.maven:supermartijn642s-config-lib-438332:5546996"

    implementation "curse.maven:epic-fight-skill-tree-1295882:7916859"
    implementation "maven.modrinth:sophisticated-backpacks:hZ1AhDRI" // Sophisticated Backpacks (not on CurseMaven - 3rd-party sharing disabled)
    implementation "curse.maven:sophisticated-core-618298:8587619" // Required library for Sophisticated Backpacks
    implementation "curse.maven:architectury-419699:8492726" // Required library for Jobs+
    implementation "curse.maven:yaml-config-1128669:8125096" // Required library for Jobs+

    // Other external libraries are kept as compileOnly so the project still builds,
    // but they are NOT loaded during devbuild testing.
    compileOnly "curse.maven:reskillablereimagined-1170464:7982937"
    compileOnly "curse.maven:ftbquest-289412:8534556"
    compileOnly "curse.maven:ftbteams-404468:7878281"
    compileOnly "curse.maven:mapatlases-519759:8588690"
    compileOnly "curse.maven:moonlightapi-499980:8578515"
    // Passive Skill Tree and its Item Production Lib dependency have no NeoForge build
    // (deliberately kept on Forge 1.20.1 by their author) - dropped
    compileOnly "curse.maven:attributefix-280510:7115922"
    compileOnly "curse.maven:pufferfishsskills-835091:8547654"
    compileOnly "curse.maven:travelersbackpack-321117:8527307"

    compileOnly "curse.maven:ftblibrary-404465:8569579"
    compileOnly "curse.maven:controlling-250398:6368976"
    compileOnly "curse.maven:searchables-858542:5831692"

    compileOnly "curse.maven:quark-243121:8420966"
    compileOnly "curse.maven:zeta-968868:7980010"
    compileOnly "curse.maven:journeymap-32274:8584487"
    // Legacy Reskillable ("rereskillable") has no NeoForge build - superseded by
    // Reskillable Reimagined above, which is the actively maintained successor
    compileOnly "curse.maven:cosmeticarmor-237307:5610814"

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
